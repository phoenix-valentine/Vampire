<title>Vampire: No Survivors</title>
<style>
/* One dark look on purpose: the game is a night scene. Every colour is a token. */
:root {
  --bg: #0b0a10;
  --ground: #14131b;
  --ink: #ece8e1;
  --ink-dim: #9b96a3;
  --blood: #c1121f;
  --blood-bright: #ff3b47;
  --danger: #ffb020;
  --panel: #1b1924;
  --panel-edge: #34303f;
  --focus: #ffe9a8;
  --tap: 48px;
  --gutter: 16px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}

/* A host page may pad the root for the notch and home bar. Counting that padding inside the
   height keeps the game exactly one screen tall instead of spilling past the bottom. */
html {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
}

/* On its own page the game owns the whole screen and the page must never scroll or bounce. */
body.standalone {
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  --inset-top: 0px;
  --inset-right: 0px;
  --inset-bottom: 0px;
  --inset-left: 0px;
}

#stage {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#touch {
  position: absolute;
  inset: 0;
  touch-action: none;
}

.layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.layer > * {
  pointer-events: auto;
}

/* Measures the notch and home bar. On its own page the game reads them from the browser;
   inside a host page that already pads for them, they read as zero. */
.inset-probe {
  position: absolute;
  visibility: hidden;
  pointer-events: none;
  padding: 0;
}

body.standalone .inset-probe {
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}

#debug {
  position: absolute;
  left: calc(var(--inset-left) + 6px);
  bottom: calc(var(--inset-bottom) + 4px);
  font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--ink-dim);
  opacity: 0.75;
  pointer-events: none;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

[hidden] {
  display: none !important;
}

button {
  font: inherit;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* ---- The bars at the top ---- */
.hud-top {
  position: absolute;
  left: calc(var(--inset-left) + 12px);
  right: calc(var(--inset-right) + 8px);
  top: calc(var(--inset-top) + 8px);
  display: flex;
  gap: 8px;
  align-items: flex-start;
  pointer-events: none;
}

.bars {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-top: 8px;
}

.bar {
  position: relative;
  height: 14px;
  border-radius: 3px;
  background: #2a0d12;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
}

.bar > i {
  position: absolute;
  inset: 0;
  display: block;
  transform-origin: left center;
  background: var(--blood);
}

.bar.pulse > i {
  background: var(--blood-bright);
}

.bar.low > i {
  animation: low-blood 0.45s steps(2, jump-none) infinite;
}

@keyframes low-blood {
  from {
    background: var(--blood);
  }
  to {
    background: var(--blood-bright);
  }
}

.bar.level {
  height: 5px;
  background: #1f1d29;
}

.bar.level > i {
  background: var(--ink);
  opacity: 0.8;
}

.hud-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
  line-height: 1.3;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 2px #000;
}

.hud-row .warn {
  color: var(--danger);
}

.btn-pause {
  pointer-events: auto;
  flex: none;
  width: var(--tap);
  height: var(--tap);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: rgba(27, 25, 36, 0.7);
  border: 1px solid var(--panel-edge);
  border-radius: 10px;
}

.btn-pause span {
  width: 5px;
  height: 18px;
  background: var(--ink);
  border-radius: 1px;
}

.banner,
.hint {
  position: absolute;
  left: calc(var(--inset-left) + 20px);
  right: calc(var(--inset-right) + 20px);
  text-align: center;
  color: var(--ink);
  text-shadow: 0 2px 3px #000, 0 0 12px #000;
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
  text-wrap: balance;
}

.banner {
  top: calc(var(--inset-top) + 96px);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.14em;
}

.hint {
  top: 62%;
  font-size: 17px;
  line-height: 1.35;
}

.banner.on,
.hint.on {
  opacity: 1;
}

/* ---- Screens ---- */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-top: calc(var(--inset-top) + 28px);
  padding-bottom: calc(var(--inset-bottom) + 20px);
  padding-left: max(var(--gutter), calc(var(--inset-left) + var(--gutter)));
  padding-right: max(var(--gutter), calc(var(--inset-right) + var(--gutter)));

  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  box-sizing: border-box;
}

.screen-cards {
  background: rgba(9, 8, 13, 0.72);
}

.screen h1 {
  margin: 0;
  font-size: 54px;
  line-height: 1;
  letter-spacing: 0.02em;
  font-weight: 800;
  color: var(--ink);
}

.screen h2 {
  margin: 0;
  font-size: 30px;
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: 0.03em;
}

.screen p {
  margin: 0;
}

.screen .sub {
  font-size: 17px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--blood-bright);
}

.screen .lead {
  font-size: 17px;
  line-height: 1.4;
  color: var(--ink-dim);
  max-width: 34ch;
}

.title-head {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 6vh;
  flex: 1;
}

.spacer {
  flex: 1;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.stack.locked {
  opacity: 0.55;
}

.btn {
  display: flex;
  flex-direction: column;
  gap: 3px;
  align-items: flex-start;
  width: 100%;
  min-height: var(--tap);
  padding: 12px 16px;
  box-sizing: border-box;
  text-align: left;
  font-size: 17px;
  line-height: 1.3;
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 12px;
}

.btn:active {
  background: #262333;
}

.btn strong {
  font-size: 19px;
  font-weight: 700;
}

.btn strong em {
  font-style: normal;
  font-weight: 400;
  font-size: 15px;
  color: var(--ink-dim);
}

.btn span {
  color: var(--ink-dim);
  font-size: 16px;
}

.btn.big {
  min-height: 64px;
  justify-content: center;
  border-color: #5a2630;
  background: #24141b;
}

.btn.big strong {
  font-size: 21px;
}

.btn.card {
  min-height: 72px;
  justify-content: center;
}

.btn.small {
  font-size: 15px;
  color: var(--ink-dim);
  background: transparent;
}

.foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--ink-dim);
}

.version {
  min-height: var(--tap);
  min-width: var(--tap);
  background: none;
  border: none;
  font-size: 13px;
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
}

.hits {
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 15px;
  line-height: 1.45;
  color: var(--danger);
  font-variant-numeric: tabular-nums;
}

.stats {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 16px;
  margin: 0;
  font-size: 16px;
  line-height: 1.35;
}

.stats dt {
  color: var(--ink-dim);
}

.stats dd {
  margin: 0;
  min-width: 0;
  font-variant-numeric: tabular-nums;
}

.report {
  width: 100%;
  min-height: 150px;
  box-sizing: border-box;
  font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--ink);
  background: #0f0e15;
  border: 1px solid var(--panel-edge);
  border-radius: 8px;
  padding: 8px;
  user-select: text;
  -webkit-user-select: text;
}

@media (prefers-reduced-motion: reduce) {
  .bar.low > i {
    animation: none;
  }
  .banner,
  .hint {
    transition: none;
  }
}
