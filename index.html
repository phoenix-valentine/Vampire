<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0e17">
<title>Shape Surge</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e17;color:#e8ecf5;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* ---------- gear button ---------- */
#gear{position:fixed;z-index:50;top:calc(22px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));
  width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(20,26,44,.72);
  color:#e8ecf5;font-size:22px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
#gear:active{transform:scale(.94)}
#gear.on{background:#5fe3ff;color:#06202a;border-color:#5fe3ff}

/* ---------- settings panel ---------- */
#panel{position:fixed;z-index:45;top:0;right:0;bottom:0;width:calc(min(330px,88vw) + env(safe-area-inset-right,0px));display:flex;flex-direction:column;
  background:rgba(12,16,28,.95);border-left:1px solid rgba(255,255,255,.12);
  transform:translateX(105%);transition:transform .16s ease-out;visibility:hidden;
  padding:calc(74px + env(safe-area-inset-top,0px)) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) 0}
#panel.open{transform:none;visibility:visible}
#panelHead{display:flex;gap:8px;padding:0 12px 10px 12px;flex-wrap:wrap}
#panelBody{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 12px 16px 12px;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pbtn{flex:1 1 auto;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.07);color:#e8ecf5;font-weight:600;font-size:13px;line-height:1.1;font-family:inherit;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.pbtn:active{background:rgba(255,255,255,.2)}
.pbtn.warn{border-color:rgba(255,120,120,.5);color:#ffb3b3}
.pbtn.on{background:#5fe3ff;color:#06202a;border-color:#5fe3ff}
details{border-top:1px solid rgba(255,255,255,.1);padding:6px 0}
summary{cursor:pointer;font-weight:700;font-size:12px;line-height:1;font-family:inherit;letter-spacing:.12em;text-transform:uppercase;color:#8fa3c8;padding:15px 0;list-style:none;touch-action:manipulation}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:#5a6a8a;font-size:15px}
details[open] summary::after{content:"\2212"}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 8px;padding:5px 0}
.row .nm{font-size:14px;color:#dfe6f5}
.row output{font:600 13px/1 ui-monospace,Menlo,Consolas,monospace;color:#5fe3ff;min-width:52px;text-align:right}
.row.changed output,.row.tog.changed .nm{color:#ffd24d}
.row input[type=range]{grid-column:1/3;width:100%;height:34px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;touch-action:pan-y;cursor:pointer}
.row input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.row input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#e8ecf5;border:3px solid #5fe3ff;margin-top:-9px}
.row input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#e8ecf5;border:3px solid #5fe3ff}
.row.tog{grid-template-columns:1fr auto;min-height:42px;cursor:pointer}
.row.tog input{position:absolute;opacity:0;pointer-events:none}
.sw{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);position:relative;transition:background .12s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#e8ecf5;transition:transform .12s}
.row.tog input:checked + .sw{background:#5fe3ff}
.row.tog input:checked + .sw::after{transform:translateX(20px)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0}
.hint{font-size:12px;color:#7183a6;padding:8px 0 0 0;line-height:1.4}
/* Overlays (level-up cards, death summary) keep clear of the open panel: beside the side drawer,
   above the bottom sheet, or over the drawer when the screen is too narrow to share. */
body.panel-open .overlay{right:calc(min(330px,88vw) + env(safe-area-inset-right,0px))}
@media (orientation:landscape) and (max-width:700px){
  body.panel-open .overlay{right:0;z-index:46}
}
@media (orientation:portrait) and (max-width:720px){
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:46%;border-left:none;border-top:1px solid rgba(255,255,255,.16);
    transform:translateY(105%);padding:10px 0 env(safe-area-inset-bottom,0px) 0}
  #panel.open{transform:none}
  body.panel-open .overlay{right:0;bottom:46%;justify-content:flex-start}   /* little room above the sheet: start from the top and scroll */
}

/* ---------- overlays ---------- */
.overlay{position:fixed;z-index:40;left:0;top:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;justify-content:safe center;   /* 'safe': a stack taller than the space scrolls from its top instead of losing it */
  padding:calc(16px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));
  background:rgba(6,8,16,.62);overflow-y:auto}
.overlay.show{display:flex}
.big{font-weight:900;font-size:clamp(28px,7vmin,54px);line-height:1;font-family:inherit;letter-spacing:.08em;margin:0 0 6px 0;text-align:center}
.sub{font-size:14px;color:#9fb0d0;margin:0 0 16px 0;text-align:center}
#lvTitle{color:#ffe14d;animation:pop .28s cubic-bezier(.2,1.6,.4,1)}
#cards{display:flex;gap:12px;width:100%;max-width:880px;justify-content:center;align-items:stretch}
.card{flex:1 1 0;min-width:0;max-width:280px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
  padding:14px 12px;border-radius:16px;border:2px solid rgba(255,255,255,.16);background:linear-gradient(180deg,#1a2238,#111728);
  color:#e8ecf5;font-family:inherit;cursor:pointer;touch-action:manipulation;opacity:0;transform:translateY(18px) scale(.94);
  animation:cardIn .22s cubic-bezier(.2,1.4,.4,1) forwards}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}
.card.sel,.card:hover{border-color:var(--c,#5fe3ff);box-shadow:0 0 0 3px rgba(255,255,255,.06),0 8px 30px rgba(0,0,0,.5)}
.card:active{transform:scale(.97)}
.card canvas{width:64px;height:64px}
.card .cn{font-weight:800;font-size:17px;line-height:1.15;font-family:inherit}
.card .ct{font-weight:700;font-size:11px;line-height:1;font-family:inherit;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:20px;background:rgba(255,255,255,.1);color:var(--c,#5fe3ff)}
.card .ct.new{background:var(--c,#5fe3ff);color:#0b0e17}
.card .cd{font-size:13px;line-height:1.35;color:#b9c5de}
.card .ck{font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;color:#5a6a8a;margin-top:auto;padding-top:4px}
#cards.locked .card{pointer-events:none}
@media (orientation:portrait) and (max-width:720px){
  #cards{flex-direction:column;max-width:420px}
  .card{max-width:none;flex:0 0 auto;flex-direction:row;text-align:left;align-items:center;gap:12px;padding:10px 12px}
  .card canvas{width:54px;height:54px;flex:0 0 auto}
  .card .cbody{display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:0}
  .card .ck{display:none}
}
.cbody{display:flex;flex-direction:column;gap:6px;align-items:center}
@media (max-height:430px){
  .card{padding:8px 10px;gap:4px}.card canvas{width:44px;height:44px}.big{font-size:26px}.sub{margin-bottom:8px}.card .cd{font-size:12px}
}
#stats{display:grid;grid-template-columns:repeat(3,auto);gap:6px 26px;margin:6px 0 20px 0;text-align:center}
#stats b{display:block;font:800 clamp(24px,6vmin,40px)/1.1 ui-monospace,Menlo,Consolas,monospace;color:#fff}
#stats span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8fa3c8}
#again{min-width:220px;min-height:56px;border-radius:16px;border:none;background:#5fe3ff;color:#06202a;font-weight:800;font-size:18px;line-height:1;font-family:inherit;cursor:pointer;touch-action:manipulation}
#again:active{transform:scale(.96)}
#again:disabled{opacity:.45}
#overTitle{color:#ff5a6a}
@keyframes cardIn{to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="safe"></div>
<button id="gear" tabindex="-1" title="Tweak settings (T)" aria-label="Settings">&#9881;</button>

<aside id="panel" aria-label="Live settings">
  <div id="panelHead">
    <button class="pbtn" tabindex="-1" id="btnPause">Pause</button>
    <button class="pbtn warn" tabindex="-1" id="btnReset">Reset to defaults</button>
  </div>
  <div id="panelBody"></div>
</aside>

<div id="levelup" class="overlay">
  <h1 class="big" id="lvTitle">LEVEL UP</h1>
  <p class="sub" id="lvSub">Pick one</p>
  <div id="cards"></div>
</div>

<div id="gameover" class="overlay">
  <h1 class="big" id="overTitle">OVERRUN</h1>
  <p class="sub" id="overSub"></p>
  <div id="stats">
    <div><b id="stTime">0:00</b><span>Survived</span></div>
    <div><b id="stKills">0</b><span>Kills</span></div>
    <div><b id="stLevel">1</b><span>Level</span></div>
  </div>
  <button id="again" tabindex="-1">Play again</button>
  <p class="sub" style="margin-top:12px">Space / Enter / tap</p>
</div>

<script>
"use strict";
(function(){

/* =====================================================================
   SHAPE SURGE — a one-file bullet heaven core loop.
   Sections: 1 Settings  2 Canvas  3 Input  4 Effects  5 Spatial grid
             6 Content (enemies, weapons, upgrades)  7 Simulation
             8 Rendering  9 UI overlays  10 Main loop
   ===================================================================== */

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const rnd = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[(Math.random() * arr.length) | 0];

/* ============================ 1. SETTINGS ============================ */
// Everything in S is read live by the game every frame, so a slider change
// applies instantly. f: 'x' multiplier, '+' additive integer, 'n' plain number.
const SETTING_GROUPS = [
  { g: 'Player', open: true, items: [
    { k: 'playerSpeed',  n: 'Move speed',        min: .5,  max: 2.5, step: .05, d: 1, f: 'x' },
    { k: 'playerHealth', n: 'Max health',        min: .25, max: 5,   step: .05, d: 1, f: 'x' },
    { k: 'pickupRange',  n: 'Pickup range',      min: .5,  max: 6,   step: .1,  d: 1, f: 'x' },
    { k: 'invincible',   n: 'Invincible',        toggle: true, d: false },
  ]},
  { g: 'Weapons', open: true, items: [
    { k: 'damage',       n: 'Damage',            min: .25, max: 5,   step: .05, d: 1, f: 'x' },
    { k: 'fireRate',     n: 'Fire rate',         min: .25, max: 4,   step: .05, d: 1, f: 'x' },
    { k: 'extraProj',    n: 'Projectile count',  min: 0,   max: 8,   step: 1,   d: 0, f: '+' },
    { k: 'projSpeed',    n: 'Projectile speed',  min: .5,  max: 3,   step: .05, d: 1, f: 'x' },
    { k: 'area',         n: 'Attack size',       min: .5,  max: 2.5, step: .05, d: 1, f: 'x' },
    { k: 'knockback',    n: 'Knockback',         min: 0,   max: 3,   step: .1,  d: 1, f: 'x' },
  ]},
  { g: 'Enemies', open: true, items: [
    { k: 'spawnRate',    n: 'Spawn rate',        min: 0,   max: 5,   step: .05, d: 1, f: 'x' },
    { k: 'enemySpeed',   n: 'Speed',             min: .25, max: 2.5, step: .05, d: 1, f: 'x' },
    { k: 'enemyHealth',  n: 'Health',            min: .25, max: 6,   step: .05, d: 1, f: 'x' },
    { k: 'rampSpeed',    n: 'Ramp speed',        min: 0,   max: 4,   step: .05, d: 1, f: 'x' },
    { k: 'maxEnemies',   n: 'Max on screen',     min: 100, max: 1500, step: 50, d: 600, f: 'n' },
  ]},
  { g: 'Feel', open: true, items: [
    { k: 'shake',        n: 'Screen shake',      min: 0,   max: 3,   step: .1,  d: 1, f: 'x' },
    { k: 'particles',    n: 'Particles',         min: 0,   max: 3,   step: .1,  d: 1, f: 'x' },
    { k: 'dmgNumbers',   n: 'Damage numbers',    toggle: true, d: true },
    { k: 'hitStop',      n: 'Hit-stop & slow-mo', toggle: true, d: true },
    { k: 'zoom',         n: 'Camera zoom',       min: .6,  max: 1.6, step: .05, d: 1, f: 'x' },
  ]},
  { g: 'Game', open: true, items: [
    { k: 'gameSpeed',    n: 'Game speed',        min: .25, max: 3,   step: .05, d: 1, f: 'x' },
    { k: 'xpGain',       n: 'XP gain',           min: .5,  max: 5,   step: .1,  d: 1, f: 'x' },
  ]},
];
const S = {};
const settingRows = {};          // key -> { def, input, out, row }
const settingHooks = {};         // key -> fn() called after a change
for (const grp of SETTING_GROUPS) for (const it of grp.items) S[it.k] = it.d;

function fmtSetting(it, v) {
  if (it.f === 'x') return v.toFixed(2) + '×';
  if (it.f === '+') return '+' + v;
  return String(v);
}
function setSetting(k, v, fromUI) {
  const r = settingRows[k];
  S[k] = v;
  if (r) {
    if (r.def.toggle) { r.input.checked = !!v; }
    else { if (!fromUI) r.input.value = v; r.out.textContent = fmtSetting(r.def, v); }
    r.row.classList.toggle('changed', v !== r.def.d);
  }
  if (settingHooks[k]) settingHooks[k]();
}
function resetSettings() {
  for (const grp of SETTING_GROUPS) for (const it of grp.items) setSetting(it.k, it.d, false);
}
// Tap handler for buttons. A plain 'click' is never sent for a second finger while another one is
// steering, so touch taps are taken from pointerup; touchend then cancels the click the browser would add.
// own: the handler does the element's whole job (toggle rows, section headers), so the native action is cancelled.
function onTap(el, fn, own) {
  let id = -1, x = 0, y = 0;
  el.addEventListener('pointerdown', e => { id = e.pointerId; x = e.clientX; y = e.clientY; });
  el.addEventListener('pointerup', e => {
    if (e.pointerType !== 'touch' || e.pointerId !== id) return;
    id = -1;
    if (Math.hypot(e.clientX - x, e.clientY - y) <= 12) fn(e);
  });
  el.addEventListener('touchend', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  el.addEventListener('click', e => { if (own) e.preventDefault(); fn(e); });
}
function buildPanel(extraButtons) {
  const body = $('panelBody');
  for (const grp of SETTING_GROUPS) {
    const det = document.createElement('details');
    det.open = !!grp.open;
    const sum = document.createElement('summary');
    sum.textContent = grp.g;
    onTap(sum, () => { det.open = !det.open; }, true);
    det.appendChild(sum);
    for (const it of grp.items) {
      const row = document.createElement('label');
      const nm = document.createElement('span');
      nm.className = 'nm'; nm.textContent = it.n;
      const input = document.createElement('input');
      let out = null;
      if (it.toggle) {
        row.className = 'row tog';
        input.type = 'checkbox'; input.checked = it.d;
        const sw = document.createElement('span'); sw.className = 'sw';
        row.appendChild(nm); row.appendChild(input); row.appendChild(sw);
        onTap(row, () => setSetting(it.k, !S[it.k], true), true);
      } else {
        row.className = 'row';
        out = document.createElement('output');
        out.textContent = fmtSetting(it, it.d);
        input.type = 'range'; input.min = it.min; input.max = it.max; input.step = it.step; input.value = it.d;
        input.setAttribute('aria-label', it.n);
        row.appendChild(nm); row.appendChild(out); row.appendChild(input);
        input.addEventListener('input', () => setSetting(it.k, parseFloat(input.value), true));
        // A touch that turns into a scroll of the list must not leave the slider where the finger landed.
        let before = it.d;
        input.addEventListener('pointerdown', () => { before = S[it.k]; });
        input.addEventListener('pointercancel', () => setSetting(it.k, before, false));
        // Drop focus after a drag so arrow keys go back to moving the hero.
        input.addEventListener('change', () => input.blur());
        input.addEventListener('pointerup', () => input.blur());
      }
      settingRows[it.k] = { def: it, input, out, row };
      det.appendChild(row);
    }
    if (grp.g === 'Game' && extraButtons) {
      const br = document.createElement('div'); br.className = 'btnrow';
      for (const b of extraButtons) {
        const el = document.createElement('button');
        el.className = 'pbtn'; el.tabIndex = -1; el.textContent = b.n;
        onTap(el, () => { b.fn(); el.blur(); });
        br.appendChild(el);
      }
      det.appendChild(br);
    }
    body.appendChild(det);
  }
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = 'Changes apply instantly and the game keeps running while this panel is open. Yellow values differ from the defaults.';
  body.appendChild(hint);
}

/* ============================ 2. CANVAS ============================== */
const cv = $('game');
const ctx = cv.getContext('2d', { alpha: false });
const TARGET_AREA = 800 * 600;       // logical world area visible at zoom 1
let W = 1, H = 1, DPR = 1, dprCap = 2;
let VS = 1;                          // css px per world unit
let VW = 800, VH = 600;              // visible world size
const INS = { t: 0, r: 0, b: 0, l: 0 };  // safe-area insets (css px)
let vignette = null;
let offX = 0, offY = 0, offTX = 0, offTY = 0, panelInset = 0;   // view shift (css px) while the settings panel covers part of the screen

function resize() {
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, dprCap);
  const pw = Math.round(w * DPR), ph = Math.round(h * DPR);
  if (cv.width !== pw) cv.width = pw;
  if (cv.height !== ph) cv.height = ph;
  W = w; H = h;
  VS = Math.sqrt(w * h / TARGET_AREA) * S.zoom;
  VW = w / VS; VH = h / VS;
  const cs = getComputedStyle($('safe'));
  INS.t = parseFloat(cs.paddingTop) || 0; INS.r = parseFloat(cs.paddingRight) || 0;
  INS.b = parseFloat(cs.paddingBottom) || 0; INS.l = parseFloat(cs.paddingLeft) || 0;
  vignette = null;
  if (onResized) onResized();
}
let onResized = null;
settingHooks.zoom = resize;
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 60));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function getVignette() {
  if (vignette) return vignette;
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 26, 64, 64, 90);
  gr.addColorStop(0, 'rgba(255,40,60,0)');
  gr.addColorStop(1, 'rgba(255,40,60,1)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  vignette = c;
  return c;
}

/* ============================ 3. INPUT =============================== */
const keys = Object.create(null);
const MOVE_KEYS = { KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1 };
const joy = { active: false, id: -1, ox: 0, oy: 0, x: 0, y: 0, next: null };   // next: a second finger waiting to take over
const JOY_R = 52;                    // css px for full speed
const move = { x: 0, y: 0 };         // final move vector, length 0..1
let usedTouch = false, hasMoved = false;
let onKeyAction = null;              // set by the UI section

window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && t.tagName === 'INPUT' && MOVE_KEYS[e.code]) { e.preventDefault(); t.blur(); }
  if (MOVE_KEYS[e.code] || e.code === 'Space') e.preventDefault();   // never scroll the host page
  keys[e.code] = true;
  if (!e.repeat && onKeyAction) onKeyAction(e);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
let onFocusLost = null;              // set by the UI section
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; joyEnd(); if (onFocusLost) onFocusLost(); });

function joyEnd() { if (joy.active) { try { cv.releasePointerCapture(joy.id); } catch (_) {} } joy.active = false; joy.id = -1; joy.next = null; }
function joyStart(id, x, y) {
  joy.active = true; joy.id = id;
  joy.ox = joy.x = x; joy.oy = joy.y = y;                               // starts centred, so taking over never lurches
  try { cv.setPointerCapture(id); } catch (_) {}

// Hash grid over the enemy list, rebuilt once per step. Lets every weapon ask
// "which enemies are near this point" without scanning all of them.
const CELL = 56, HMASK = 4095;

    const e = enemies[i];
    e.cx = Math.floor(e.x / CELL); e.cy = Math.floor(e.y / CELL);
    const h = cellHash(e.cx, e.cy);

  const y0 = Math.floor((y - R) / CELL), y1 = Math.floor((y + R) / CELL);
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
    for (let i = cellHead[cellHash(cx, cy)]; i !== -1; i = cellNext[i]) {

      const dx = e.x - x, dy = e.y - y, rr = r + e.r;

  for (let i = 0; i < n; i++) {

  const va = Math.max(G.hurtFlash * .6, low * (.26 + .1 * Math.sin(performance.now() / 170)));

  if (G.flash > 0) { ctx.globalAlpha = G.flash * .65; ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (alive) {
    for (let i = 0; i < enemies.length; i++) { const e = enemies[i]; if (e.elite && !e.dead) drawIndicator(e.x, e.y, '#ff4d5e', true); }
    for (let i = 0; i < gems.length; i++) { const g = gems[i]; if (g.kind) drawIndicator(g.x, g.y, g.kind === 1 ? '#5dff8a' : g.kind === 2 ? '#5fe3ff' : '#ffffff', false); }
  }
  drawHUD(rdt);
  if (joy.active && G.state === 'play' && !paused) {                   // floating stick, drawn where the drag started
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy) || 1, m = Math.min(d, JOY_R);
    ctx.globalAlpha = .22; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, JOY_R, 0, TAU); ctx.stroke();
    ctx.globalAlpha = .32; ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(joy.ox + dx / d * m, joy.oy + dy / d * m, 20, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ============================ 9. UI OVERLAYS ========================= */
const elLv = $('levelup'), elCards = $('cards'), elOver = $('gameover'), elPanel = $('panel'), elGear = $('gear'),
      elAgain = $('again'), elPause = $('btnPause');
let choices = [], sel = -1, lockUntil = 0, panelOpen = false, bestTime = 0, runs = 0;

function hideOverlays() { elLv.classList.remove('show'); elOver.classList.remove('show'); }
function markSel() { for (let i = 0; i < elCards.children.length; i++) elCards.children[i].classList.toggle('sel', i === sel); }
function openLevelUp() {
  G.state = 'levelup'; G.lvT = 0;
  choices = rollChoices(); sel = -1;
  elCards.textContent = '';
  choices.forEach((u, i) => {
    const L = lv[u.id] || 0, filler = u.kind === 'filler';
    const b = document.createElement('button');
    b.className = 'card'; b.type = 'button'; b.tabIndex = -1; b.style.setProperty('--c', u.color);
    const ic = document.createElement('canvas'); ic.width = ic.height = 128;
    const g = ic.getContext('2d'); g.translate(64, 64); g.scale(2.3, 2.3); u.icon(g);
    const body = document.createElement('div'); body.className = 'cbody';
    const nm = document.createElement('div'); nm.className = 'cn'; nm.textContent = u.name;
    const tag = document.createElement('div');
    tag.className = 'ct' + (!filler && L === 0 ? ' new' : '');
    tag.textContent = filler ? 'Bonus' : L === 0 ? (u.kind === 'weapon' ? 'New weapon' : 'New') : L + 1 >= u.max ? 'Level ' + (L + 1) + ' · max' : 'Level ' + (L + 1);
    const ds = document.createElement('div'); ds.className = 'cd'; ds.textContent = filler ? u.desc[0] : u.desc[L];
    body.appendChild(nm); body.appendChild(tag); body.appendChild(ds);
    const key = document.createElement('div'); key.className = 'ck'; key.textContent = 'press ' + (i + 1);
    b.appendChild(ic); b.appendChild(body); b.appendChild(key);
    onTap(b, () => choose(i));
    elCards.appendChild(b);
  });
  // Cards ignore input for a moment so a finger that was steering cannot pick one by accident.
  elCards.classList.add('locked');
  lockUntil = performance.now() + 350;
  setTimeout(() => elCards.classList.remove('locked'), 350);
  $('lvSub').textContent = 'Level ' + (G.level - G.pendingLv + 1) + ' · pick one';
  elLv.classList.add('show');
}
function choose(i) {
  if (G.state !== 'levelup' || performance.now() < lockUntil || !choices[i]) return;
  applyUpgrade(choices[i]);
  G.pendingLv--; G.picks++;
  if (G.pendingLv > 0) { openLevelUp(); return; }
  elLv.classList.remove('show');
  G.state = 'play';
  joy.ox = joy.x; joy.oy = joy.y;                                       // a thumb that never lifted starts again from centre: no lurch
  // Breathing room on the way back in: a blast that shoves the swarm away, and a moment of safety.
  player.iframe = Math.max(player.iframe, .9);
  G.rampIn = .35;
  blasts.push({ x: player.x, y: player.y, r: 190, dmg: DMG(6 + 2 * G.level), t: 0, kb: 560, col: '#ffe14d', pc: C_GOLD });
  addShake(.3);
  try { cv.focus({ preventScroll: true }); } catch (_) {}
}
function showGameOver() {
  G.state = 'dead';
  const best = G.time > bestTime && runs > 0;
  bestTime = Math.max(bestTime, G.time); runs++;
  $('stTime').textContent = fmtTime(G.time);
  $('stKills').textContent = G.kills;
  $('stLevel').textContent = G.level;
  $('overSub').textContent = best ? 'New best this session!' : 'Best this session: ' + fmtTime(bestTime);
  elAgain.disabled = true;
  lockUntil = performance.now() + 450;
  setTimeout(() => { elAgain.disabled = false; }, 450);
  elOver.classList.add('show');
}
function restart() {
  if (G.state === 'dead' && performance.now() < lockUntil) return;
  newGame();
  try { cv.focus({ preventScroll: true }); } catch (_) {}
}
function setPaused(v) {
  paused = v;
  elPause.textContent = paused ? 'Resume' : 'Pause';
  elPause.classList.toggle('on', paused);
}
function measurePanel() {
  offTX = offTY = panelInset = 0;
  if (!panelOpen) return;
  if (elPanel.offsetHeight >= H * .8) { panelInset = elPanel.offsetWidth; offTX = -panelInset / 2; }   // side drawer
  else offTY = -elPanel.offsetHeight / 2;                                                            // bottom sheet
}
function togglePanel(v) {
  panelOpen = v === undefined ? !panelOpen : v;
  document.body.classList.toggle('panel-open', panelOpen);    // overlays shrink to the space the panel leaves
  elPanel.classList.toggle('open', panelOpen);
  elGear.classList.toggle('on', panelOpen);
  measurePanel();
}
onTap(elGear, () => { togglePanel(); elGear.blur(); });
onTap(elPause, () => { setPaused(!paused); elPause.blur(); });
onTap($('btnReset'), () => { resetSettings(); $('btnReset').blur(); });
onTap(elAgain, () => { elAgain.blur(); restart(); });
cv.addEventListener('pointerdown', () => { if (paused) setPaused(false); });
document.addEventListener('visibilitychange', () => {
  last = 0;
  if (document.hidden && G.state === 'play') setPaused(true);          // never come back to a death you did not see
});

onFocusLost = () => { if (G.state === 'play') setPaused(true); };
onResized = measurePanel;

onKeyAction = e => {
  const c = e.code;
  if (G.state === 'levelup') {
    const n = choices.length;
    if (c === 'Digit1' || c === 'Numpad1') choose(0);
    else if (c === 'Digit2' || c === 'Numpad2') choose(1);
    else if (c === 'Digit3' || c === 'Numpad3') choose(2);
    else if (c === 'ArrowLeft' || c === 'ArrowUp' || c === 'KeyA' || c === 'KeyW') { sel = sel <= 0 ? n - 1 : sel - 1; markSel(); }
    else if (c === 'ArrowRight' || c === 'ArrowDown' || c === 'KeyD' || c === 'KeyS') { sel = (sel + 1) % n; markSel(); }
    else if ((c === 'Enter' || c === 'Space') && sel >= 0) choose(sel);
    return;
  }
  if (G.state === 'dead') { if (c === 'Enter' || c === 'Space' || c === 'KeyR') restart(); return; }
  if (c === 'KeyT') togglePanel();
  else if (c === 'Escape' && panelOpen) togglePanel(false);
  else if (c === 'KeyP' || c === 'Escape') { if (paused || G.state === 'play') setPaused(!paused); }
};

// Test buttons. Before the first move they also start the run, so they never look dead.
const live = () => { if (G.state === 'ready') { G.state = 'play'; everPlayed = true; } return G.state === 'play'; };
buildPanel([
  { n: 'Level up now', fn: () => { if (live()) gainLevel(); } },
  { n: 'Skip ahead 1 min', fn: () => { if (live()) G.diff += 60; } },
  // two passes: Splitters release Shardlings as they die, and those go too
  { n: 'Clear enemies', fn: () => { if (live()) for (let p = 0; p < 2; p++) for (let i = enemies.length - 1; i >= 0; i--) if (!enemies[i].dead) killEnemy(enemies[i], 0, 0); } },
  { n: 'Restart run', fn: () => { newGame(); } },
]);

/* ============================ 10. MAIN LOOP ========================== */
let last = 0, fpsT = 0, fpsN = 0, lowFps = 0;
let lowBest = 0, probeN = 0, probeBest = 0, probeFps = 0, probeCap = 2, adaptOff = false, retried = false;   // adaptive resolution: see frame()
function frame(now) {
  requestAnimationFrame(frame);
  if (!last) { last = now; render(0); return; }
  const raw = (now - last) / 1000;
  last = now;
  const rdt = clamp(raw, 0, .1);

  fpsT += raw; fpsN++;
  if (fpsT >= .5) {
    fps = fpsN / fpsT; fpsText = Math.round(fps) + ' fps'; fpsT = 0; fpsN = 0;
    // If the device cannot keep up, render at a lower pixel density rather than drop frames. Each drop is
    // checked over the next two seconds: if it bought no frame rate (a 30 Hz power-saving cap, say), it is undone
    // for good. Best windows are compared, because a stray hitch only ever makes a window look worse.
    const playing = G.state === 'play' && !paused;
    if (probeN > 0) {
      if (playing) { probeBest = Math.max(probeBest, fps); if (--probeN === 0 && probeBest < probeFps * 1.15) { dprCap = probeCap; adaptOff = true; resize(); } }
    } else if (!adaptOff && fps < 42 && playing) { lowFps++; lowBest = Math.max(lowBest, fps); }
    else lowFps = lowBest = 0;
    if (lowFps >= 4 && dprCap > 1) { probeFps = lowBest; probeCap = dprCap; dprCap = Math.max(1, dprCap - .5); lowFps = lowBest = 0; probeN = 4; probeBest = 0; resize(); }
  }

  readMove();
  let simDt = 0;
  if (!paused) {
    // No clock runs until the first input: an embedded frame may not have focus yet.
    if (G.state === 'ready' && (move.x || move.y || joy.active)) { G.state = 'play'; everPlayed = true; }
    if (G.state === 'play') {
      let ts = S.gameSpeed;
      if (G.stopCool > 0) G.stopCool -= rdt;
      if (G.hitstop > 0) { G.hitstop -= rdt; ts = 0; if (G.hitstop <= 0) G.stopCool = .15; }   // real time, or it would never end
      else if (G.pendingLv > 0) {                                      // a beat of slow motion, then the cards
        G.lvT += rdt;
        if (S.hitStop) ts *= .22;
        if (G.lvT >= (S.hitStop ? .24 : .03)) openLevelUp();
      } else if (G.rampIn > 0) {                                       // ease back up to speed after a pick
        G.rampIn -= rdt;
        if (S.hitStop) ts *= 1 - .7 * clamp(G.rampIn / .35, 0, 1);
      }
      simDt = rdt * ts;
    } else if (G.state === 'dying') {
      G.deadT += rdt; simDt = rdt * S.gameSpeed * (S.hitStop ? .3 : 1);
      if (G.deadT >= 1.1) showGameOver();
    } else if (G.state === 'dead') simDt = rdt * .3;
  }
  if (simDt > 0 && G.state !== 'levelup') {
    const n = Math.min(8, Math.max(1, Math.ceil(simDt * 50)));         // sub-steps keep fast game speeds stable
    const h = simDt / n;
    for (let i = 0; i < n; i++) step(h, i === n - 1 ? n : 0);
    updateParticles(simDt); updateRings(simDt); updateDmgNums(simDt);
  }
  G.xpShown += (G.xp / G.xpNeed - G.xpShown) * (1 - Math.exp(-14 * rdt));
  if (G.xpPulse > 0) G.xpPulse -= rdt * 5;
  if (G.hurtFlash > 0) G.hurtFlash -= rdt * 2.6;
  if (G.flash > 0) G.flash -= rdt * 2.2;
  updateCamera(rdt, player.x + player.vx * .1, player.y + player.vy * .1, false);
  const ok = 1 - Math.exp(-12 * rdt);
  offX += (offTX - offX) * ok; offY += (offTY - offY) * ok;
  render(rdt);
}

// Small handle for the console and for automated playtests.
window.__game = { S, setSetting, resetSettings, player, enemies, gems, lv, st, keys, move, blasts, choose, newGame, step, setPaused, rollChoices, applyUpgrade, upgrades: UPG_BY_ID,
  get G() { return G; }, get choices() { return choices; }, get paused() { return paused; }, get view() { return { W, H, VW, VH, VS, DPR }; } };

resize();
newGame();
try { cv.focus({ preventScroll: true }); } catch (_) {}
requestAnimationFrame(frame);

})();
</script>
</body>
